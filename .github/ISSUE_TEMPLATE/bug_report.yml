name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not report security vulnerabilities here. See SECURITY.md.
        Never paste API keys, identity.json or private keys.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest set of commands or code that shows the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or a commit hash
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Envelope or signature verification
        - Delegation
        - Quorum
        - Receipts
        - HTTP inbox
        - MCP server
        - CLI
        - Docs
        - Other
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: Node 22.x, macOS / Linux / Windows, MCP client name
